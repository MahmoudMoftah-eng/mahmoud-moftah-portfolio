<svg xmlns="http://www.w3.org/2000/svg" width="2700" height="880" viewBox="0 0 2700 880" role="img" aria-labelledby="title description">
  <title id="title">ABRA Hunter — System Architecture</title>
  <desc id="description">ABRA Hunter autonomous UAV system architecture showing camera vision, competition server target data and drone telemetry feeding guidance, followed by control reference, controllers, RC command and drone plant.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c7a15a"/>
    </marker>
    <style>
      .title { fill: #f2f0e9; font: 600 32px Inter, Arial, sans-serif; letter-spacing: .2px; }
      .subtitle { fill: #98a39d; font: 400 17px Inter, Arial, sans-serif; letter-spacing: 1.4px; }
      .lane-label { fill: #aeb7b1; font: 600 14px Inter, Arial, sans-serif; letter-spacing: 1.5px; }
      .block { fill: #18201e; stroke: #66736d; stroke-width: 2; }
      .block-accent { fill: #201f19; stroke: #c7a15a; stroke-width: 3; }
      .block-text { fill: #f2f0e9; font: 500 24px Inter, Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .block-text-small { fill: #f2f0e9; font: 500 21px Inter, Arial, sans-serif; text-anchor: middle; }
      .note { fill: #98a39d; font: 400 19px Inter, Arial, sans-serif; text-anchor: middle; }
      .flow { fill: none; stroke: #8d9993; stroke-width: 3; marker-end: url(#arrow); }
      .input-flow { fill: none; stroke: #c7a15a; stroke-width: 3; marker-end: url(#arrow); }
      .divider { stroke: #303a36; stroke-width: 1; }
    </style>
  </defs>

  <rect width="2700" height="880" rx="18" fill="#111716"/>
  <text class="title" x="60" y="62">ABRA Hunter — System Architecture</text>
  <text class="subtitle" x="60" y="94">AUTONOMOUS GUIDANCE AND CONTROL DATA FLOW</text>
  <line class="divider" x1="60" y1="120" x2="2640" y2="120"/>

  <text class="lane-label" x="60" y="154">VISION INPUT</text>
  <rect class="block" x="60" y="178" width="180" height="78" rx="10"/>
  <text class="block-text" x="150" y="217">Camera</text>
  <path class="flow" d="M240 217 H300"/>
  <rect class="block" x="300" y="178" width="180" height="78" rx="10"/>
  <text class="block-text" x="390" y="217">Vision</text>
  <path class="flow" d="M480 217 H540"/>
  <rect class="block" x="540" y="178" width="260" height="78" rx="10"/>
  <text class="block-text" x="670" y="217">VisionMeasurement</text>
  <text class="note" x="670" y="285">pixel target and lock state</text>

  <text class="lane-label" x="60" y="366">SERVER TARGET INPUT</text>
  <rect class="block" x="60" y="390" width="250" height="78" rx="10"/>
  <text class="block-text-small" x="185" y="421">Competition Server</text>
  <text class="block-text-small" x="185" y="445">Target Data</text>
  <path class="flow" d="M310 429 H360"/>
  <rect class="block" x="360" y="390" width="250" height="78" rx="10"/>
  <text class="block-text-small" x="485" y="421">Server Target</text>
  <text class="block-text-small" x="485" y="445">Adapter</text>
  <path class="flow" d="M610 429 H660"/>
  <rect class="block" x="660" y="390" width="230" height="78" rx="10"/>
  <text class="block-text" x="775" y="429">raw TargetState</text>
  <text class="note" x="775" y="497">north/east/altitude and</text>
  <text class="note" x="775" y="517">velocity in meters</text>
  <path class="flow" d="M890 429 H940"/>
  <rect class="block" x="940" y="390" width="120" height="78" rx="10"/>
  <text class="block-text" x="1000" y="429">UKF</text>
  <path class="flow" d="M1060 429 H1110"/>
  <rect class="block" x="1110" y="390" width="230" height="78" rx="10"/>
  <text class="block-text" x="1225" y="429">clean TargetState</text>
  <text class="note" x="1225" y="497">north/east/altitude and</text>
  <text class="note" x="1225" y="517">velocity in meters</text>

  <text class="lane-label" x="60" y="604">TELEMETRY INPUT</text>
  <rect class="block" x="60" y="628" width="250" height="78" rx="10"/>
  <text class="block-text" x="185" y="667">Drone Telemetry</text>
  <path class="flow" d="M310 667 H360"/>
  <rect class="block" x="360" y="628" width="250" height="78" rx="10"/>
  <text class="block-text" x="485" y="667">Telemetry Runtime</text>
  <path class="flow" d="M610 667 H660"/>
  <rect class="block" x="660" y="628" width="230" height="78" rx="10"/>
  <text class="block-text" x="775" y="667">DroneState</text>
  <text class="note" x="775" y="735">drone position, attitude,</text>
  <text class="note" x="775" y="755">velocity</text>

  <path class="input-flow" d="M800 217 H1390 V411 H1450"/>
  <path class="input-flow" d="M1340 429 H1450"/>
  <path class="input-flow" d="M890 667 H1390 V447 H1450"/>

  <rect class="block-accent" x="1450" y="380" width="210" height="98" rx="10"/>
  <text class="block-text" x="1555" y="429">Guidance</text>
  <path class="flow" d="M1660 429 H1710"/>
  <rect class="block" x="1710" y="390" width="250" height="78" rx="10"/>
  <text class="block-text" x="1835" y="429">ControlReference</text>
  <path class="flow" d="M1960 429 H2010"/>
  <rect class="block" x="2010" y="390" width="190" height="78" rx="10"/>
  <text class="block-text" x="2105" y="429">Controllers</text>
  <path class="flow" d="M2200 429 H2250"/>
  <rect class="block" x="2250" y="390" width="190" height="78" rx="10"/>
  <text class="block-text" x="2345" y="429">RC Command</text>
  <path class="flow" d="M2440 429 H2490"/>
  <rect class="block" x="2490" y="390" width="160" height="78" rx="10"/>
  <text class="block-text-small" x="2570" y="421">Drone</text>
  <text class="block-text-small" x="2570" y="445">Plant</text>

  <line class="divider" x1="60" y1="804" x2="2640" y2="804"/>
  <text class="subtitle" x="60" y="842">VERIFIED PROJECT ARCHITECTURE · INPUTS CONVERGE AT GUIDANCE</text>
</svg>
