<svg xmlns="http://www.w3.org/2000/svg" width="2700" height="880" viewBox="0 0 2700 880" role="img" aria-labelledby="title description">
  <title id="title">ABRA Hunter — Active Controller Architecture</title>
  <desc id="description">Verified active ABRA Hunter controller architecture. Guidance produces a ControlReference which splits into an AngleModeAdapter path for roll, pitch and yaw commands and a cascaded altitude and vertical-velocity path for throttle. Both paths form an RCCommand that SkyDaggerLink converts to RC microseconds for Betaflight ANGLE mode.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c7a15a"/>
    </marker>
    <style>
      .title { fill: #f2f0e9; font: 600 32px Inter, Arial, sans-serif; letter-spacing: .2px; }
      .subtitle { fill: #98a39d; font: 400 17px Inter, Arial, sans-serif; letter-spacing: 1.4px; }
      .lane-label { fill: #c7a15a; font: 700 14px Inter, Arial, sans-serif; letter-spacing: 1.7px; }
      .block { fill: #18201e; stroke: #66736d; stroke-width: 2; }
      .block-accent { fill: #201f19; stroke: #c7a15a; stroke-width: 3; }
      .block-common { fill: #17201d; stroke: #8f9b95; stroke-width: 2.5; }
      .block-title { fill: #f2f0e9; font: 600 21px Inter, Arial, sans-serif; text-anchor: middle; }
      .block-title-lg { fill: #f2f0e9; font: 600 24px Inter, Arial, sans-serif; text-anchor: middle; }
      .detail { fill: #b9c1bc; font: 400 17px Inter, Arial, sans-serif; text-anchor: middle; }
      .field { fill: #d7d9d4; font: 500 17px "SFMono-Regular", Consolas, monospace; }
      .note { fill: #98a39d; font: 400 16px Inter, Arial, sans-serif; text-anchor: middle; }
      .flow { fill: none; stroke: #c7a15a; stroke-width: 3; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #8d9993; stroke-width: 3; marker-end: url(#arrow); }
      .divider { stroke: #303a36; stroke-width: 1; }
      .lane-bg { fill: #141b19; stroke: #2d3834; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="2700" height="880" rx="18" fill="#111716"/>
  <text class="title" x="60" y="56">ABRA Hunter — Active Controller Architecture</text>
  <text class="subtitle" x="60" y="86">VERIFIED GUIDANCE-TO-RC COMMAND FLOW</text>
  <line class="divider" x1="60" y1="108" x2="2640" y2="108"/>

  <rect class="block-accent" x="60" y="154" width="240" height="92" rx="10"/>
  <text class="block-title-lg" x="180" y="194">Guidance</text>
  <text class="note" x="180" y="220">reference generation</text>
  <path class="flow" d="M300 200 H360"/>

  <rect class="block" x="360" y="128" width="680" height="144" rx="10"/>
  <text class="block-title-lg" x="700" y="158">ControlReference</text>
  <line class="divider" x1="388" y1="172" x2="1012" y2="172"/>
  <text class="field" x="402" y="200">hedef_roll_deg</text>
  <text class="field" x="402" y="228">hedef_pitch_deg</text>
  <text class="field" x="402" y="256">hedef_yaw_deg</text>
  <text class="field" x="720" y="200">hedef_irtifa_m</text>
  <text class="field" x="720" y="228">dikey_hiz_limiti_ms</text>
  <text class="note" x="866" y="255">optional</text>

  <path class="branch" d="M1040 200 H1080 V367 H1120"/>
  <path class="branch" d="M1080 200 V577 H1120"/>
  <circle cx="1080" cy="200" r="5" fill="#c7a15a"/>

  <rect class="lane-bg" x="1095" y="294" width="1130" height="150" rx="12"/>
  <text class="lane-label" x="1120" y="321">ANGLE PATH</text>
  <rect class="block" x="1120" y="337" width="270" height="82" rx="9"/>
  <text class="block-title" x="1255" y="371">AngleModeAdapter</text>
  <text class="note" x="1255" y="397">angle error to RC axes</text>
  <path class="flow" d="M1390 378 H1450"/>
  <rect class="block" x="1450" y="337" width="290" height="82" rx="9"/>
  <text class="block-title" x="1595" y="369">roll % · pitch % · yaw %</text>
  <text class="note" x="1595" y="397">bounded axis commands</text>
  <path class="flow" d="M1740 378 H1800"/>
  <rect class="block" x="1800" y="337" width="270" height="82" rx="9"/>
  <text class="block-title" x="1935" y="371">Axis slew limits</text>
  <text class="note" x="1935" y="397">bounded command change</text>
  <path class="flow" d="M2070 378 H2290"/>

  <rect class="lane-bg" x="1095" y="500" width="1130" height="154" rx="12"/>
  <text class="lane-label" x="1120" y="527">VERTICAL PATH</text>
  <rect class="block" x="1120" y="543" width="260" height="88" rx="9"/>
  <text class="block-title" x="1250" y="571">hedef_irtifa_m</text>
  <text class="detail" x="1250" y="598">→ Z PID outer loop</text>
  <text class="note" x="1250" y="619">altitude feedback</text>
  <path class="flow" d="M1380 587 H1420"/>
  <rect class="block" x="1420" y="543" width="250" height="88" rx="9"/>
  <text class="block-title" x="1545" y="570">Vertical velocity ref.</text>
  <text class="detail" x="1545" y="598">VZ limit + VZ-ref slew</text>
  <path class="flow" d="M1670 587 H1710"/>
  <rect class="block" x="1710" y="543" width="250" height="88" rx="9"/>
  <text class="block-title" x="1835" y="571">VZ PI inner loop</text>
  <text class="detail" x="1835" y="598">throttle correction</text>
  <text class="note" x="1835" y="619">vertical-velocity feedback</text>
  <path class="flow" d="M1960 587 H2000"/>
  <rect class="block" x="2000" y="535" width="210" height="104" rx="9"/>
  <text class="block-title" x="2105" y="562">Throttle conditioning</text>
  <text class="detail" x="2105" y="587">+ hover feed-forward</text>
  <text class="detail" x="2105" y="610">÷ roll/pitch tilt comp.</text>
  <text class="note" x="2105" y="630">clamp + throttle slew</text>
  <path class="flow" d="M2210 587 H2252 V422 H2460 V419"/>

  <rect class="block-common" x="2290" y="326" width="340" height="93" rx="10"/>
  <text class="block-title-lg" x="2460" y="363">RCCommand</text>
  <text class="detail" x="2460" y="391">gas · roll · pitch · yaw %</text>
  <path class="flow" d="M2460 419 V463"/>
  <rect class="block-common" x="2290" y="463" width="340" height="78" rx="10"/>
  <text class="block-title" x="2460" y="497">SkyDaggerLink.komut</text>
  <text class="note" x="2460" y="521">RC channel generation</text>
  <path class="flow" d="M2460 541 V579"/>
  <rect class="block-common" x="2290" y="579" width="340" height="72" rx="10"/>
  <text class="block-title" x="2460" y="607">RC microseconds</text>
  <text class="note" x="2460" y="632">roll · pitch · throttle · yaw</text>
  <path class="flow" d="M2460 651 V689"/>
  <rect class="block-accent" x="2290" y="689" width="340" height="82" rx="10"/>
  <text class="block-title-lg" x="2460" y="721">Betaflight ANGLE mode</text>
  <text class="note" x="2460" y="749">low-level flight stabilization</text>

  <line class="divider" x1="60" y1="802" x2="2640" y2="802"/>
  <text class="subtitle" x="60" y="839">PORTFOLIO SCOPE · GUIDANCE · REFERENCE GENERATION · CASCADED VERTICAL CONTROL · RC INTERFACE</text>
  <text class="note" x="2460" y="839">Betaflight provides the low-level controller</text>
</svg>
