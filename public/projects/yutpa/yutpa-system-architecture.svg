<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">YUTPA autonomous UAV final system architecture</title>
  <desc id="desc">Raspberry Pi 5 mission computer communicates with a SpeedyBee F405 V4 flight controller over USB Type-C using pymavlink and MAVLink. ArduPilot runs on the flight controller, GPS provides navigation data, Mission Planner supports mission upload and monitoring, AUTO handles autonomous takeoff, mission execution, return and landing, and GUIDED supports target alignment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="1" stop-color="#0d2235"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a53"/>
      <stop offset="1" stop-color="#0c2b41"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59d5e0"/>
    </marker>
    <style>
      .title{font:700 38px Arial,sans-serif;fill:#f3f8fb;letter-spacing:.4px}.subtitle{font:400 18px Arial,sans-serif;fill:#9db2c3}.eyebrow{font:700 14px Arial,sans-serif;fill:#59d5e0;letter-spacing:2px}.node-title{font:700 25px Arial,sans-serif;fill:#f4f9fc}.node-copy{font:400 17px Arial,sans-serif;fill:#bdcad5}.chip{font:700 14px Arial,sans-serif;fill:#82e5eb;letter-spacing:.5px}.mode{font:700 24px Arial,sans-serif;fill:#f4f9fc}.mode-copy{font:400 17px Arial,sans-serif;fill:#bed0dc}.label{font:700 15px Arial,sans-serif;fill:#7ce0e7}.history{font:400 15px Arial,sans-serif;fill:#8299aa}.line{stroke:#59d5e0;stroke-width:4;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}.oneway{stroke:#59d5e0;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#8ca3b3;stroke-width:3;stroke-dasharray:10 9;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <path d="M0 690 C340 600 520 805 860 700 S1270 600 1600 720 V900 H0Z" fill="#102d43" opacity=".55"/>

  <text x="90" y="82" class="eyebrow">FINAL POST-PSR CONFIGURATION</text>
  <text x="90" y="132" class="title">YUTPA Autonomous UAV System Architecture</text>
  <text x="90" y="169" class="subtitle">Mission computing, MAVLink communication, navigation and flight-mode responsibilities</text>

  <g filter="url(#shadow)">
    <rect x="82" y="250" width="385" height="250" rx="22" fill="url(#primary)" stroke="#2f6379" stroke-width="2"/>
    <rect x="112" y="280" width="178" height="30" rx="15" fill="#0b293c" stroke="#2f7284"/>
    <text x="132" y="301" class="chip">MISSION COMPUTER</text>
    <text x="112" y="356" class="node-title">Raspberry Pi 5</text>
    <text x="112" y="397" class="node-copy">Autonomous mission logic</text>
    <text x="112" y="430" class="node-copy">gorev1.py mission generation</text>
    <text x="112" y="463" class="node-copy">pymavlink interface</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1133" y="250" width="385" height="250" rx="22" fill="url(#primary)" stroke="#2f6379" stroke-width="2"/>
    <rect x="1163" y="280" width="183" height="30" rx="15" fill="#0b293c" stroke="#2f7284"/>
    <text x="1183" y="301" class="chip">FLIGHT CONTROLLER</text>
    <text x="1163" y="356" class="node-title">SpeedyBee F405 V4</text>
    <text x="1163" y="397" class="node-copy">ArduPilot flight stack</text>
    <text x="1163" y="430" class="node-copy">Flight-mode execution</text>
    <text x="1163" y="463" class="node-copy">Navigation and vehicle control</text>
  </g>

  <path d="M467 375 H1133" class="line"/>
  <rect x="626" y="324" width="348" height="102" rx="18" fill="#081c2a" stroke="#397489" stroke-width="2"/>
  <text x="800" y="360" text-anchor="middle" class="label">USB TYPE-C</text>
  <text x="800" y="390" text-anchor="middle" class="node-copy">pymavlink / MAVLink</text>

  <g filter="url(#shadow)">
    <rect x="188" y="576" width="370" height="166" rx="20" fill="#102c40" stroke="#37697d" stroke-width="2"/>
    <text x="220" y="622" class="node-title">Mission Planner</text>
    <text x="220" y="660" class="node-copy">Mission upload</text>
    <text x="220" y="693" class="node-copy">Vehicle monitoring</text>
  </g>
  <path d="M558 657 C785 657 925 564 1133 454" class="dash"/>

  <g filter="url(#shadow)">
    <rect x="1042" y="585" width="225" height="156" rx="20" fill="#12374a" stroke="#4d8898" stroke-width="2"/>
    <text x="1074" y="628" class="mode">AUTO</text>
    <text x="1074" y="665" class="mode-copy">Takeoff · mission</text>
    <text x="1074" y="696" class="mode-copy">Return · landing</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1293" y="585" width="225" height="156" rx="20" fill="#12374a" stroke="#4d8898" stroke-width="2"/>
    <text x="1325" y="628" class="mode">GUIDED</text>
    <text x="1325" y="665" class="mode-copy">Target-alignment</text>
    <text x="1325" y="696" class="mode-copy">flow</text>
  </g>
  <path d="M1245 500 V555 H1155 V585" class="oneway"/>
  <path d="M1406 500 V585" class="oneway"/>

  <g filter="url(#shadow)">
    <rect x="741" y="576" width="215" height="166" rx="20" fill="#102c40" stroke="#37697d" stroke-width="2"/>
    <text x="773" y="622" class="node-title">GPS</text>
    <text x="773" y="660" class="node-copy">Navigation</text>
    <text x="773" y="693" class="node-copy">position data</text>
  </g>
  <path d="M956 631 C1007 610 1044 571 1160 500" class="oneway"/>

  <line x1="90" y1="816" x2="1510" y2="816" stroke="#27475a"/>
  <text x="90" y="854" class="history">Pixhawk Cube Orange: earlier pre-PSR design · Final controller: SpeedyBee F405 V4</text>
</svg>
